name: Frontend CD

# Deploys the frontend to GitHub Pages after Frontend CI has passed on main.
# Pages is configured with "GitHub Actions" as its source, so the site lives at
# https://annaseku.github.io/unimelb-find-me-funding/ until a custom domain
# is added; the Vite base path is read from that configuration at build time.
on:
  workflow_run:
    workflows: ["Frontend CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: frontend-cd
  cancel-in-progress: false

defaults:
  run:
    working-directory: frontend

jobs:
  deploy:
    name: Build and deploy to GitHub Pages
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - id: pages
        uses: actions/configure-pages@v6

      - run: npm ci

      - name: Build for Pages
        run: npm run build
        env:
          # base_path is "/<repo>" for a project site or "" on a custom domain.
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - name: SPA fallback so deep links such as /results survive a refresh
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

      - id: deployment
        uses: actions/deploy-pages@v5
