# Tool configuration only. Runtime dependencies stay in requirements.txt so
# teammates keep using plain venv + pip, as the crawler README describes.

[tool.pytest.ini_options]
# ".." puts the repository root on sys.path so `backend.ranking...` imports
# resolve the same way they do for the crawler.
pythonpath = [".."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# crawler/ is Jummana's package and is being rewritten on feature/backend-crawler;
# lint it once that lands so CI does not force reformatting into her merge.
extend-exclude = ["crawler"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# Imports are `backend.<pkg>` from the repository root, one level above this file.
known-first-party = ["backend"]
